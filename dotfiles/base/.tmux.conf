# ~/.tmux.conf — Loadout base tmux configuration
# Managed by Loadout. Works for plain tmux and iTerm2 integration (`tmux -CC`).
# Extend in ~/.tmux.conf.local.

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g focus-events on
# Let iTerm2 escape sequences (imgcat, shell-integration marks, OSC 52
# clipboard) pass through when running plain (non -CC) tmux.
set -g allow-passthrough on
set -g set-clipboard on
# Pass extended keys through (e.g. iTerm2's Shift+Enter CSI u binding).
set -g extended-keys on

# ---------------------------------------------------------------------------
# Behavior
# ---------------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Keep iTerm2 tab titles meaningful (zsh sets the title; let it through).
set -g set-titles on
set -g set-titles-string "#T"
setw -g aggressive-resize on

# Open new splits/windows in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Local overrides (last)
# ---------------------------------------------------------------------------
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
